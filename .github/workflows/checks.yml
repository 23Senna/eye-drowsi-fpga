name: Repository checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  host-gui:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: '8.0.x'
      - run: python -m pip install -r tools/requirements-live.txt
      - run: python -m pip check
      - run: python tools/check_documentation.py
      - run: python -m unittest discover -s tools -p "test_*.py" -q
      - run: dotnet build tools/gui-smoke/GuiSmoke.csproj -c Release
      - run: .\tools\gui-smoke\bin\Release\net8.0-windows\GuiSmoke.exe
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==1.26.4
      - run: sudo apt-get update && sudo apt-get install -y iverilog
      - run: python tools/check_documentation.py
      - run: bash run_sim.sh
